<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>장쌤 Premium 관리자</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    #jangssam-ai-helper{position:fixed;right:22px;bottom:22px;z-index:2147483647;width:min(390px,calc(100vw - 28px));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #jangssam-ai-toggle{float:right;border:0;border-radius:12px;padding:14px 18px;background:#172b2b;color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.18)}
    #jangssam-ai-panel{display:none;clear:both;margin-bottom:10px;padding:18px;border:1px solid #dfe5e5;border-radius:14px;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.18)}
    #jangssam-ai-panel.open{display:block}
    #jangssam-ai-panel h3{margin:0 0 6px;color:#172b2b;font-size:18px}
    #jangssam-ai-panel p{margin:0 0 14px;color:#5b6666;font-size:13px;line-height:1.5}
    #jangssam-ai-panel label{display:block;margin:11px 0 5px;color:#263535;font-size:13px;font-weight:700}
    #jangssam-ai-panel input,#jangssam-ai-panel select{box-sizing:border-box;width:100%;min-height:42px;padding:9px 11px;border:1px solid #cfd8d8;border-radius:8px;background:#fff;font:inherit}
    #jangssam-ai-generate{width:100%;margin-top:14px;border:0;border-radius:9px;padding:12px 14px;background:#172b2b;color:#fff;font-size:14px;font-weight:800;cursor:pointer}
    #jangssam-ai-generate:disabled{opacity:.55;cursor:wait}
    #jangssam-ai-status{margin-top:10px;font-size:13px;line-height:1.45;white-space:pre-wrap}
    #jangssam-ai-status.ok{color:#0a6b44}
    #jangssam-ai-status.error{color:#b42318}
    @media(max-width:640px){#jangssam-ai-helper{right:14px;bottom:14px}}
  </style>
</head>
<body>
  <div id="jangssam-ai-helper">
    <div id="jangssam-ai-panel">
      <h3>✨ AI 포스팅 자동작성</h3>
      <p>새 포스팅 작성 화면에서 주제를 입력하면 AI가 현재 입력칸에 초안을 채웁니다.</p>

      <label for="jangssam-ai-keyword">주제 / 핵심 키워드</label>
      <input id="jangssam-ai-keyword" type="text" maxlength="200" placeholder="예: 중학생 수학 성적이 안 오르는 이유">

      <label for="jangssam-ai-audience">주요 독자</label>
      <select id="jangssam-ai-audience">
        <option>학생·학부모</option>
        <option>초등학생·학부모</option>
        <option>중학생·학부모</option>
        <option>고등학생·학부모</option>
        <option>검정고시 준비생·학부모</option>
      </select>

      <label for="jangssam-ai-category">카테고리</label>
      <select id="jangssam-ai-category">
        <option>자동 선택</option>
        <option>수학</option><option>영어</option><option>국어</option><option>과학</option>
        <option>검정고시</option><option>코딩</option><option>학습관리</option><option>교육소식</option>
      </select>

      <button id="jangssam-ai-generate" type="button">AI 초안 생성 → 현재 포스팅에 자동입력</button>
      <div id="jangssam-ai-status"></div>
    </div>
    <button id="jangssam-ai-toggle" type="button">✨ AI 자동작성</button>
  </div>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) window.netlifyIdentity.on("login", () => { document.location.href="/admin/"; });
      });
      window.netlifyIdentity.on("login", () => window.netlifyIdentity.close());
    }
  </script>

  <script>
  (() => {
    "use strict";

    const $ = id => document.getElementById(id);
    const panel = $("jangssam-ai-panel");
    const toggle = $("jangssam-ai-toggle");
    const generate = $("jangssam-ai-generate");
    const status = $("jangssam-ai-status");

    toggle.addEventListener("click", () => panel.classList.toggle("open"));

    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = type;
    }

    const clean = value => String(value ?? "").replace(/\s+/g, " ").trim().toLowerCase();
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function visible(el) {
      if (!el) return false;
      const r = el.getBoundingClientRect();
      return r.width > 0 && r.height > 0;
    }

    function editableControls(root = document) {
      return Array.from(root.querySelectorAll("input, textarea, select, [contenteditable='true']"))
        .filter(visible)
        .filter(el => !el.closest("#jangssam-ai-helper"));
    }

    function labelTextFor(el) {
      const bits = [];
      const id = el.getAttribute("id");
      if (id) {
        try {
          const label = document.querySelector(`label[for="${CSS.escape(id)}"]`);
          if (label) bits.push(label.textContent || "");
        } catch (_) {}
      }
      let node = el.parentElement;
      for (let i = 0; node && i < 5; i++, node = node.parentElement) {
        const directLabels = Array.from(node.children || []).filter(x => x.tagName === "LABEL");
        for (const label of directLabels) bits.push(label.textContent || "");
        const legend = node.querySelector(":scope > legend");
        if (legend) bits.push(legend.textContent || "");
      }
      bits.push(el.getAttribute("aria-label") || "");
      bits.push(el.getAttribute("name") || "");
      bits.push(el.getAttribute("placeholder") || "");
      return clean(bits.join(" "));
    }

    function findField(names, root = document) {
      const wanted = names.map(clean);
      const controls = editableControls(root);
      for (const el of controls) {
        const hay = labelTextFor(el);
        if (wanted.some(w => hay === w || hay.includes(w))) return el;
      }
      return null;
    }

    function setNativeValue(el, value) {
      const win = el.ownerDocument.defaultView || window;
      const str = String(value ?? "");

      if (el.isContentEditable) {
        el.focus();
        el.textContent = str;
        el.dispatchEvent(new win.Event("input", { bubbles: true }));
        el.dispatchEvent(new win.Event("change", { bubbles: true }));
        return;
      }

      let proto;
      if (el instanceof win.HTMLTextAreaElement) proto = win.HTMLTextAreaElement.prototype;
      else if (el instanceof win.HTMLSelectElement) proto = win.HTMLSelectElement.prototype;
      else proto = win.HTMLInputElement.prototype;

      const descriptor = Object.getOwnPropertyDescriptor(proto, "value");
      if (descriptor && typeof descriptor.set === "function") {
        Reflect.apply(descriptor.set, el, [str]);
      } else {
        el.value = str;
      }

      el.dispatchEvent(new win.Event("input", { bubbles: true }));
      el.dispatchEvent(new win.Event("change", { bubbles: true }));
    }

    function setField(names, value) {
      const el = findField(names);
      if (!el) return false;

      if (el.tagName === "SELECT") {
        const target = clean(value);
        const option = Array.from(el.options).find(o => clean(o.value) === target || clean(o.textContent) === target);
        if (!option) return false;
        setNativeValue(el, option.value);
      } else {
        setNativeValue(el, value);
      }
      return true;
    }

    function clickBooleanField(labelNames, desired) {
      const wanted = labelNames.map(clean);
      const labels = Array.from(document.querySelectorAll("label")).filter(visible);
      for (const label of labels) {
        const text = clean(label.textContent);
        if (!wanted.some(w => text === w || text.startsWith(w))) continue;
        let scope = label.parentElement;
        for (let i = 0; scope && i < 4; i++, scope = scope.parentElement) {
          const checkbox = scope.querySelector("input[type='checkbox']");
          if (checkbox) {
            if (checkbox.checked !== Boolean(desired)) checkbox.click();
            return true;
          }
          const button = scope.querySelector("button[role='switch'], [role='switch']");
          if (button) {
            const on = button.getAttribute("aria-checked") === "true";
            if (on !== Boolean(desired)) button.click();
            return true;
          }
        }
      }
      return false;
    }

    function today() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    async function applyDraft(draft) {
      if (!draft || typeof draft !== "object") throw new Error("AI 초안 데이터가 없습니다.");
      if (String(draft.body || "").trim().length < 2200) {
        throw new Error(`AI 본문이 ${String(draft.body || "").trim().length}자로 너무 짧습니다.`);
      }
      if (!Array.isArray(draft.faq) || draft.faq.length !== 5) {
        throw new Error("AI FAQ가 정확히 5개가 아닙니다.");
      }

      const checks = {
        slug: setField(["주소용 영문 이름", "slug"], draft.slug),
        title: setField(["제목", "title"], draft.title),
        date: setField(["작성일", "date"], today()),
        category: setField(["카테고리", "category"], draft.category),
        excerpt: setField(["목록 요약", "excerpt"], draft.excerpt),
        imageAlt: setField(["대표 이미지 설명", "imagealt", "image alt"], draft.imageAlt),
        aiSummary: setField(["ai 검색 핵심답변", "ai 핵심답변", "aisummary"], draft.aiSummary),
        faq1Question: setField(["FAQ 1 질문", "faq1question"], draft.faq[0].question),
        faq1Answer: setField(["FAQ 1 답변", "faq1answer"], draft.faq[0].answer),
        faq2Question: setField(["FAQ 2 질문", "faq2question"], draft.faq[1].question),
        faq2Answer: setField(["FAQ 2 답변", "faq2answer"], draft.faq[1].answer),
        faq3Question: setField(["FAQ 3 질문", "faq3question"], draft.faq[2].question),
        faq3Answer: setField(["FAQ 3 답변", "faq3answer"], draft.faq[2].answer),
        faq4Question: setField(["FAQ 4 질문", "faq4question"], draft.faq[3].question),
        faq4Answer: setField(["FAQ 4 답변", "faq4answer"], draft.faq[3].answer),
        faq5Question: setField(["FAQ 5 질문", "faq5question"], draft.faq[4].question),
        faq5Answer: setField(["FAQ 5 답변", "faq5answer"], draft.faq[4].answer),
        body: setField(["본문", "body"], draft.body)
      };

      clickBooleanField(["추천 글", "featured"], true);
      clickBooleanField(["공개", "published"], true);
      await sleep(250);

      const missing = Object.entries(checks).filter(([, ok]) => !ok).map(([key]) => key);
      if (missing.length) throw new Error("자동입력하지 못한 항목: " + missing.join(", "));

      const bodyEl = findField(["본문", "body"]);
      const bodyValue = bodyEl ? String(bodyEl.value ?? bodyEl.textContent ?? "").trim() : "";
      if (bodyValue.length < 2200) throw new Error(`본문 입력 검증 실패 (${bodyValue.length}자)`);

      let faqDone = 0;
      for (let i = 1; i <= 5; i++) {
        const q = findField([`FAQ ${i} 질문`, `faq${i}question`]);
        const a = findField([`FAQ ${i} 답변`, `faq${i}answer`]);
        if (String(q?.value || "").trim() && String(a?.value || "").trim()) faqDone++;
      }
      if (faqDone !== 5) throw new Error(`FAQ 입력 검증 실패 (${faqDone}/5)`);

      return { basicCount: Object.keys(checks).length, faqCount: faqDone, bodyLength: bodyValue.length };
    }

    generate.addEventListener("click", async () => {
      const keyword = $("jangssam-ai-keyword").value.trim();
      const audience = $("jangssam-ai-audience").value;
      const category = $("jangssam-ai-category").value;

      if (!keyword) return setStatus("주제/키워드를 입력해주세요.", "error");
      if (!findField(["제목", "title"]) || !findField(["주소용 영문 이름", "slug"])) {
        return setStatus("먼저 새 포스팅 작성 화면을 열어주세요.", "error");
      }

      generate.disabled = true;
      setStatus("AI가 제목·요약·본문·FAQ까지 작성하고 있습니다…");

      try {
        const response = await window.fetch("/.netlify/functions/ai-post-draft", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ keyword, audience, category })
        });
        const result = await response.json();
        if (!response.ok || !result.ok || !result.draft) throw new Error(result.error || "AI 초안 생성에 실패했습니다.");

        const applied = await applyDraft(result.draft);
        setStatus(
          `자동입력 완료\nFAQ ${applied.faqCount}개 + 본문 ${applied.bodyLength.toLocaleString()}자\n\n내용을 확인한 뒤 게시해주세요.` +
          (result.draft.imagePrompt ? `\n\n대표 이미지 참고:\n${result.draft.imagePrompt}` : ""),
          "ok"
        );
      } catch (error) {
        setStatus("자동작성 중단: " + (error?.message || String(error)) + "\n게시하지 말고 오류 내용을 알려주세요.", "error");
      } finally {
        generate.disabled = false;
      }
    });
  })();
  </script>

  <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>
</body>
</html>
