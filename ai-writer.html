<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>장쌤 AI 포스팅 작성기</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f5f7fb;color:#10233f;font-family:Arial,"Noto Sans KR",sans-serif}
    .wrap{max-width:980px;margin:0 auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}
    h1{font-size:28px;margin:0}.back{color:#1f5fbf;text-decoration:none;font-weight:700}.card{background:#fff;border:1px solid #dfe6ef;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(16,35,63,.06);margin-bottom:18px}
    .grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
    label{display:block;font-size:13px;font-weight:800;margin:0 0 7px}input,select,textarea{width:100%;border:1px solid #ccd6e3;border-radius:10px;padding:12px;font:inherit;background:#fff;color:#10233f}
    textarea{min-height:92px;resize:vertical}.body{min-height:520px}.btn{border:0;border-radius:11px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:#2167e8;color:#fff}.secondary{background:#eaf1ff;color:#174ea6}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.status{font-size:14px;margin-top:12px;color:#5a6b80}.hidden{display:none}.faq{border:1px solid #e1e7ef;border-radius:12px;padding:12px;margin:10px 0}.faq textarea{min-height:72px}.note{font-size:13px;color:#66768a;line-height:1.6}.danger{color:#b42318}.ok{color:#067647}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.two{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>✨ 장쌤 AI 포스팅 작성기</h1><div class="note">키워드만 넣으면 초안을 만들고, 검토·수정한 뒤 기존 CMS 형식의 JSON으로 준비합니다.</div></div><a class="back" href="/admin/">← 관리자 목록</a></div>

  <section class="card">
    <div class="grid">
      <div><label>주제 / 핵심 키워드</label><input id="keyword" placeholder="예: 중학생 수학 성적 안 오르는 이유"></div>
      <div><label>대상</label><select id="audience"><option>중학생</option><option>초등학생</option><option>고등학생</option><option>검정고시 준비생</option><option>학부모</option><option>전체</option></select></div>
      <div><label>카테고리</label><select id="category"><option>수학</option><option>영어</option><option>국어</option><option>과학</option><option>검정고시</option><option>코딩</option><option>학습관리</option><option>교육소식</option></select></div>
    </div>
    <div class="row"><button id="generate" class="btn primary">AI 초안 만들기</button></div>
    <div id="status" class="status">아직 생성하지 않았습니다.</div>
  </section>

  <section id="editor" class="card hidden">
    <div class="two"><div><label>제목</label><input id="title"></div><div><label>주소용 영문 이름 (slug)</label><input id="slug"></div></div>
    <div class="two" style="margin-top:12px"><div><label>작성일</label><input id="date" type="date"></div><div><label>카테고리</label><select id="outCategory"><option>수학</option><option>영어</option><option>국어</option><option>과학</option><option>검정고시</option><option>코딩</option><option>학습관리</option><option>교육소식</option></select></div></div>
    <div style="margin-top:12px"><label>목록 요약</label><textarea id="excerpt"></textarea></div>
    <div style="margin-top:12px"><label>AI 검색 핵심답변</label><textarea id="aiSummary"></textarea></div>
    <div style="margin-top:12px"><label>대표 이미지 설명 / 제작 문구</label><textarea id="imageAlt"></textarea></div>
    <div style="margin-top:12px"><label>본문</label><textarea id="body" class="body"></textarea></div>
    <div style="margin-top:12px"><label>FAQ</label><div id="faqs"></div></div>
    <div class="two" style="margin-top:12px"><label><input id="featured" type="checkbox" style="width:auto"> 추천 글</label><label><input id="published" type="checkbox" style="width:auto" checked> 공개</label></div>
    <div class="row"><button id="copyJson" class="btn secondary">JSON 복사</button><button id="downloadJson" class="btn secondary">JSON 파일 저장</button></div>
    <div class="note" style="margin-top:12px">현재 단계에서는 AI가 자동 공개하지 않습니다. 생성 결과를 검토한 뒤 다음 단계에서 관리자에서 바로 저장/발행 기능을 연결합니다.</div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
function setStatus(msg, cls=''){ $('status').textContent=msg; $('status').className='status '+cls; }
function token(){ try{return window.netlifyIdentity?.currentUser()?.token?.access_token || ''}catch(e){return ''} }
function renderFAQ(items){ $('faqs').innerHTML=''; (items||[]).forEach((x,i)=>{const d=document.createElement('div');d.className='faq';d.innerHTML=`<label>질문 ${i+1}</label><input class="fq" value="${String(x.question||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><label style="margin-top:8px">답변</label><textarea class="fa"></textarea>`;d.querySelector('.fa').value=x.answer||'';$('faqs').appendChild(d)}) }
function getPost(){return {slug:$('slug').value.trim(),title:$('title').value.trim(),date:$('date').value,category:$('outCategory').value,excerpt:$('excerpt').value.trim(),image:'',imageAlt:$('imageAlt').value.trim(),featured:$('featured').checked,published:$('published').checked,aiSummary:$('aiSummary').value.trim(),faq:[...document.querySelectorAll('.faq')].map(d=>({question:d.querySelector('.fq').value.trim(),answer:d.querySelector('.fa').value.trim()})).filter(x=>x.question&&x.answer),body:$('body').value.trim()}}
async function ensureLogin(){if(token())return true;window.netlifyIdentity.open('login');return false}
window.netlifyIdentity?.on('login',()=>window.netlifyIdentity.close());
$('generate').onclick=async()=>{const keyword=$('keyword').value.trim();if(!keyword){setStatus('주제/키워드를 먼저 입력하세요.','danger');return}if(!(await ensureLogin()))return;const btn=$('generate');btn.disabled=true;setStatus('AI가 초안을 작성하고 있습니다…');try{const r=await fetch('/.netlify/functions/ai-post-draft',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token()},body:JSON.stringify({keyword,audience:$('audience').value,category:$('category').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'초안 생성 실패');$('title').value=data.title||'';$('slug').value=data.slug||'';$('date').value=new Date().toISOString().slice(0,10);$('outCategory').value=data.category||$('category').value;$('excerpt').value=data.excerpt||'';$('aiSummary').value=data.aiSummary||'';$('imageAlt').value=data.imageAlt||'';$('body').value=data.body||'';renderFAQ(data.faq||[]);$('editor').classList.remove('hidden');setStatus('초안 생성 완료. 아래 내용을 검토·수정하세요.','ok');$('editor').scrollIntoView({behavior:'smooth'})}catch(e){setStatus(e.message,'danger')}finally{btn.disabled=false}};
$('copyJson').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(getPost(),null,2));alert('JSON을 복사했습니다.')};
$('downloadJson').onclick=()=>{const p=getPost();if(!p.slug){alert('slug를 확인하세요.');return}const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=p.slug+'.json';a.click();URL.revokeObjectURL(a.href)};
</script>
</body></html>
