backend:
  name: git-gateway
  branch: main

site_url: "https://jangssam-premium.netlify.app"
display_url: "https://jangssam-premium.netlify.app"
locale: ko
publish_mode: simple
show_preview_links: false
media_folder: "이미지/blog"
public_folder: "/이미지/blog"
logo_url: "/이미지/로고.png"

collections:
  - name: "education_posts"
    label: "교육정보 포스팅"
    label_singular: "포스팅"
    folder: "content/posts"
    extension: "json"
    format: "json"
    create: true
    delete: false
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{date}} · {{category}} · {{title}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - label: "주소용 영문 이름"
        name: "slug"
        widget: "string"
        hint: "영문 소문자·숫자·하이픈만 사용하세요. 저장 후에는 변경하지 않는 것을 권장합니다."
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "영문 소문자, 숫자, 하이픈만 사용할 수 있습니다."]
      - { label: "제목", name: "title", widget: "string" }
      - { label: "작성일", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "카테고리"
        name: "category"
        widget: "select"
        options: ["수학", "영어", "국어", "과학", "검정고시", "코딩", "학습관리", "교육소식"]
      - { label: "목록 요약", name: "excerpt", widget: "text", hint: "검색결과와 글 목록에 표시되는 1~2문장입니다." }
      - { label: "대표 이미지", name: "image", widget: "image", required: false, choose_url: false }
      - { label: "대표 이미지 설명", name: "imageAlt", widget: "string", required: false }
      - { label: "추천 글", name: "featured", widget: "boolean", default: false }
      - { label: "공개", name: "published", widget: "boolean", default: true }
      - label: "AI 검색 핵심답변"
        name: "aiSummary"
        widget: "text"
        required: false
      - label: "AI/검색 자주 묻는 질문"
        name: "faq"
        widget: "list"
        required: false
        label_singular: "질문"
        summary: "{{fields.question}}"
        fields:
          - { label: "질문", name: "question", widget: "string" }
          - { label: "답변", name: "answer", widget: "text" }
      - { label: "본문", name: "body", widget: "markdown" }
